name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Download speech model
        run: |
          mkdir -p app/src/main/assets
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip -d app/src/main/assets
          mv app/src/main/assets/vosk-model-small-en-us-0.15 app/src/main/assets/model
          echo "saja-model" > app/src/main/assets/model/uuid
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: saja-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
